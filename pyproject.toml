[project]
name = "dbt-analytics"
version = "0.1.0"
description = "Analytics Engineering project"
readme = "README.md"
authors = [
    { name = "Vinicius Sa", email = "viniciusagsa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.10.0",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
]

[project.scripts]
dbt-analytics = "dbt_analytics:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
